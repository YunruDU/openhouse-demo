    $body._route = null;
    if (!to) {
      if (from) startMarker(from);
      $body.innerHTML = from && from === custom
        ? '<div class="rn-empty"><b style="color:#16a34a">✓ 已標出你的位置</b>（地圖上綠色的「起」，可以拖曳微調）。<br>接著在「終點」打館名或活動名稱。</div>'
        : '<div class="rn-empty">在「終點」打一兩個字（館名、簡稱如「史語所」，或活動名稱），就會畫出步行路線、時間和沿路會看到的建築。</div>';
      return;
    }
    if (!from) { $body.innerHTML = '<div class="rn-empty">請選擇起點。</div>'; return; }
    if (from === to || (from.name === to.name && from.kind === to.kind)) { $body.innerHTML = '<div class="rn-empty">起點和終點是同一個地方。</div>'; return; }
    const r = plan(from, to);
    if (!r) { $body.innerHTML = '<div class="rn-empty">找不到步行路線，請改選其他起點。</div>'; return; }
    const day = dayKey();
    const evMarks = r.marks.filter(m => m.place && PLACES.has(m.name)).map(m => ({ m, n: PLACES.get(m.name).events.filter(e => eventOnDay(e, day)).length })).filter(x => x.n);
    const plainMarks = r.marks.filter(m => !evMarks.some(x => x.m === m));
    $body.innerHTML = `
      <div class="rn-sum"><span class="rn-min">約 ${r.minutes} 分鐘</span><span class="rn-meta">步行 ${fmtM(r.total)}${r.climb >= 5 ? ` · 有上坡（爬升約 ${Math.round(r.climb)} 公尺）` : ' · 大致平路'}</span></div>
      <ol class="rn-steps">${r.steps.map(s => `<li data-s="${s.s}"><i class="fa-solid ${s.icon}"></i><div>${s.html}</div></li>`).join('')}</ol>
      ${evMarks.length ? `<div class="rn-along"><h4><i class="fa-solid fa-star" style="color:#f59e0b"></i> 順路活動${day ? `（${day}）` : ''}：點一下改走到這館</h4><div class="rn-chips">${evMarks.map(x => `<span class="rn-chip ev" data-go="${esc(x.m.name)}">${esc(disp(x.m.name))} · ${x.n} 項</span>`).join('')}</div></div>` : ''}
      ${plainMarks.length ? `<div class="rn-along"><h4><i class="fa-solid fa-building"></i> 沿路會看到</h4><div class="rn-chips">${plainMarks.map(m => `<span class="rn-chip">${esc(disp(m.name))}</span>`).join('')}</div></div>` : ''}
      <div class="rn-note">時間以每分鐘約 ${WALK_M_PER_MIN} 公尺估算，上坡另外加時間；路線依 OpenStreetMap 步道資料推算，現場請依指標與工作人員引導。</div>`;
    draw(r, from, to);                                   // 面板內容填好後再畫，才能依面板實際大小調整地圖視野
    store.set('rn-last-dest', to.kind === 'place' ? to.name : '');
    if (typeof trackEvent === 'function') trackEvent('route_plan', { from: from.name, to: to.name, meters: Math.round(r.total) });
    $body._route = r;
  }

  $body.addEventListener('click', ev => {
    const chip = ev.target.closest('[data-go]');
    if (chip) { $to.set(chip.dataset.go); return; }
    const li = ev.target.closest('li[data-s]');
    if (li && $body._route) {
      const [x, z] = pointAt($body._route.P, +li.dataset.s);
      map.setView(toLL(x, z), Math.max(map.getZoom(), 18), { animate: true });
    }
  });
  panel.querySelector('#rnSwap').onclick = () => {
    const f = $from.value, t = $to.value;
    if (!t) return;
    $from.set(t, true); $to.set(f);
  };
  function setPicking(on) {
    picking = on;
    hint.style.display = on ? 'block' : 'none';
    panel.querySelector('#rnPick').classList.toggle('on', on);
    map.getContainer().classList.toggle('rn-picking', on);
  }
  function setMyLocation(ll) {
    setPicking(false);
    if (isSouth(ll.lat)) return;
    custom = { name: '我的位置', lat: ll.lat, lng: ll.lng, kind: 'custom' };
    store.set('rn-last-dest', '');
    $from.set('__custom__');
  }
  panel.querySelector('#rnPick').onclick = () => setPicking(!picking);
  // 選位置時攔下地圖上的點擊（點在館舍圖釘上也算，不打開資訊框）；拖曳地圖不算點擊
  const mc = map.getContainer();
  let downXY = null;
  mc.addEventListener('pointerdown', e => { downXY = picking ? [e.clientX, e.clientY] : null; }, true);
  mc.addEventListener('click', e => {
    if (!picking || e.target.closest('.leaflet-control')) return;
    if (downXY && Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 6) return;
    e.stopPropagation(); e.preventDefault();
    map.closePopup();
    setMyLocation(map.mouseEventToLatLng(e));
  }, true);

  function open(toName, fromName) {
    const to = toName ? findPoint(toName) : null;
    if (toName && !to) {
      const ev = allEventsData.find(e => e.location === toName);
      if (ev && isSouth(parseFloat(ev.lat))) { alert('南部院區（台南）目前不提供步行路線。'); return; }
    }
    let from = fromName || '';
    if (!from) {
      const last = store.get('rn-last-dest');
      if (last && last !== toName && PLACES.has(last)) from = last;          // 剛走到的館舍 → 當作下一段的起點
      else if (custom) from = '__custom__';
      else { const rc = receptions(); from = rc.length ? rc[0].name : ''; }
    }
    $from.set(from === '__custom__' || findPoint(from) ? from : '', true);
    $to.set(to ? to.name : '', true);
    layout();
    panel.classList.add('open');
    document.body.classList.add('rn-active');
    map.closePopup();
    if (typeof closeMobileDrawer === 'function' && window.innerWidth <= 768) closeMobileDrawer();
    render();
    if (!to && window.innerWidth > 768) setTimeout(() => $to.input.focus(), 50);   // 電腦版直接可以打字
  }
  function close() {
    panel.classList.remove('open');
    document.body.classList.remove('rn-active');
    setPicking(false);
    layer.clearLayers();
  }
  panel.querySelector('.rn-x').onclick = close;
  // 地圖區域太窄（平板、縮小的視窗）時改成底部面板，避免整個蓋住路線
  function layout() { panel.classList.toggle('narrow', host.clientWidth < 760); }
  window.addEventListener('resize', layout);

  // 地圖上方的「步行路線」按鈕
  const bar = document.querySelector('.campus-switch-bar');
  if (bar) {
    const b = document.createElement('button');
    b.className = 'campus-btn rn-open-btn';
    b.type = 'button';
    b.innerHTML = '<i class="fa-solid fa-person-walking"></i> 步行路線';
    b.onclick = () => (panel.classList.contains('open') ? close() : open());
    bar.appendChild(b);
  }

  // 網址參數 ?from=館舍&to=館舍
  const q = new URLSearchParams(location.search);
  if (q.get('to')) setTimeout(() => open(q.get('to'), q.get('from') || ''), 700);

  window.RouteNav = { open, close, plan, findPoint };
})();

  </script>
</body>
</html>
