e": "互動體驗", "target": "全年齡", "location": "地球科學研究所", "lat": "25.0404504450634", "lng": "121.614027936811", "coordinates": "25.0404504450634, 121.614027936811", "map_url": "https://maps.google.com?q=25.0404504450634,121.614027936811", "contact_person": "顏小姐", "contact_phone": "", "contact_email": "", "notes": "全年齡，特別推薦國小至高中學生。", "description": "我們腳下的地球看似平靜，其實充滿了肉眼看不見的震動與地下構造！\n在這個互動體驗中，你將利用地震檢波器（Geophone）偵測跳躍所產生的地面震動，並在電腦上即時觀察自己的地震波形（Seismogram）。接著，透過透地雷達（Ground Penetrating Radar, GPR）向地下發射電磁波，利用不同地下物質產生的反射訊號，找出看不見的物體與構造。\n從地面的震動到地下的探索，親自體驗地球科學家如何運用「波」與科學儀器，觀測我們無法直接看見的地球。\n動一動、測一測、想一想，一起探索腳下的世界！\n注意事項:\n1. 自由參加, 依現場人流分批體驗, 每組體驗時間約 5–8 分鐘\n2. 如排隊人數過多，將視情況提前停止排隊", "sessions_count": 1, "sessions": [{"session_name": "看見肉眼看不見的地球-用地震波與電磁波探索腳下的世界", "time": "10/17 14:00 -10/17 16:00", "speaker": "戚務正老師團隊", "sub_location": "1樓中庭", "limit": "", "note": "全年齡，特別推薦國小至高中學生。"}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "338", "title": "追蹤看不見的碳：穩定同位素質譜儀探索地球環境的秘密", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/338/%E8%B3%AA%E8%AD%9C%E5%AF%A6%E9%A9%97%E5%AE%A4.jpg", "url": "https://openhouse.sinica.edu.tw/events/338", "mode": "實體活動", "need_apply": "需報名", "organizer": "地球科學研究所", "group_name": "數理科學", "event_type": "參觀導覽", "target": "國中/12歲以上", "location": "地球科學研究所", "lat": "25.0404504450634", "lng": "121.614027936811", "coordinates": "25.0404504450634, 121.614027936811", "map_url": "https://maps.google.com?q=25.0404504450634,121.614027936811", "contact_person": "顏小姐", "contact_phone": "", "contact_email": "", "notes": "各場次開始前10分鐘, 請於地球所1樓入口處報到。", "description": "碳存在於大氣、海洋與所有生命之中，雖然看不見，卻記錄著地球環境的變化。透過穩定同位素質譜儀（Stable Isotope Ratio Mass Spectrometry, IRMS），科學家可以分析樣品中碳與氧同位素的比例，讀取自然留下的化學訊息。\n在本實驗室中，我們利用不同進樣系統分析多種地球材料。碳酸鹽樣品（如珊瑚、貝殼及鈣板藻鈣板）經由 Kiel 進樣系統轉換為二氧化碳；有機物則透過元素分析儀（EA）分析其碳含量與碳同位素。這些資料協助我們了解生物如何利用與儲存碳，並探索海洋碳循環與環境變遷。\n本次開放參觀將帶領大家認識穩定同位素分析技術，以及一台質譜儀如何從微量樣品中揭開地球環境的故事。\n注意事項:\n1. 每場次為30分鐘, 共4個場次 (下午 2:00, 2:30, 3:00, 3:30), 每場僅開放10人報名。\n2. 活動當天, 請依據您報名的場次開始前10分鐘, 於地球所1樓入口處報到, 工作人員會帶領您至 108 實驗室。", "sessions_count": 4, "sessions": [{"session_name": "追蹤看不見的碳：穩定同位素質譜儀探索地球環境的秘密", "time": "10/17 14:00 -10/17 14:30", "speaker": "劉怡偉老師", "sub_location": "1樓, 108 實驗室", "limit": "10 人", "note": "場次1"}, {"session_name": "追蹤看不見的碳：穩定同位素質譜儀探索地球環境的秘密", "time": "10/17 14:30 -10/17 15:00", "speaker": "劉怡偉老師", "sub_location": "1樓, 108 實驗室", "limit": "10 人", "note": "場次2"}, {"session_name": "追蹤看不見的碳：穩定同位素質譜儀探索地球環境的秘密", "time": "10/17 15:00 -10/17 15:30", "speaker": "劉怡偉老師", "sub_location": "1樓, 108 實驗室", "limit": "10 人", "note": "場次3"}, {"session_name": "追蹤看不見的碳：穩定同位素質譜儀探索地球環境的秘密", "time": "10/17 15:30 -10/17 16:00", "speaker": "劉怡偉老師", "sub_location": "1樓, 108 實驗室", "limit": "10 人", "note": "場次4"}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "534", "title": "不是機率的機率", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/534/115.10.17_%E5%8C%97%E9%83%A8_%E9%99%A2%E5%8D%80%E9%96%8B%E6%94%BE_%E7%A7%91%E6%99%AE%E6%BC%94%E8%AC%9B_%E6%B4%BB%E5%8B%95%E4%BB%A3%E8%A1%A8%E5%9C%96_0.jpg", "url": "https://openhouse.sinica.edu.tw/events/534", "mode": "實體活動", "need_apply": "不需報名", "organizer": "統計科學研究所", "group_name": "數理科學", "event_type": "演講座談", "target": "國中/12歲以上", "location": "統計科學研究所", "lat": "25.0414511580491", "lng": "121.613849786325", "coordinates": "25.0414511580491, 121.613849786325", "map_url": "https://maps.google.com?q=25.0414511580491,121.613849786325", "contact_person": "賴姿秀", "contact_phone": "", "contact_email": "", "notes": "", "description": "圓周率 π 的小數看似毫無規律，通過重重統計檢定，宛如一串隨機亂碼。但它「看起來隨機」，是否就代表「真的隨機」？我們將用像素點陣圖感受 π 的混亂之美，一起釐清「隨機」與「證明」之間，其實還有一段耐人尋味的距離：統計檢定只能告訴我們 π 目前「看起來」隨機，但要真正證明這份隨機性，至今仍是數學界極具挑戰、尚未解開的謎題。從根號2、希帕索斯的傳說，到祖沖之與拉馬努金的智慧，一起體驗這場「隨機，或不隨機」的探案之旅。", "sessions_count": 1, "sessions": [{"session_name": "不是機率的機率", "time": "10/17 14:00 -10/17 14:50", "speaker": "蔡宗希 副研究員", "sub_location": "B1演講廳", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "540", "title": "台灣如果有基因編輯的食品，你會吃嗎？", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/540/2026%E7%A7%91%E6%99%AE%E6%BC%94%E8%AC%9B%E6%B5%B7%E5%A0%B1__%E5%9F%BA%E5%9B%A0%E7%A7%91%E6%8A%80_.jpg", "url": "https://openhouse.sinica.edu.tw/events/540", "mode": "實體活動", "need_apply": "不需報名", "organizer": "植物暨微生物學研究所", "group_name": "生命科學", "event_type": "演講座談", "target": "國中/12歲以上", "location": "農業科技大樓", "lat": "25.0429922120068", "lng": "121.614966712417", "coordinates": "25.0429922120068, 121.614966712417", "map_url": "https://maps.google.com?q=25.0429922120068,121.614966712417", "contact_person": "謝宜真", "contact_phone": "", "contact_email": "", "notes": "", "description": "從 2022 年認識「基因編輯與基改作物」，到 2023 年探討「植物學家能利用基因編輯做什麼？」，植微所持續帶大家了解這項新穎的生物科技。\n當基因編輯技術逐步走入農業與餐桌，我們該如何看待這項科技？如果未來台灣出現基因編輯的食品，你會選擇購買與食用嗎？\n今年，謝明勳研究員將延續這項主題，深入淺出地解析「基因編輯技術」在食品領域的應用現況、安全考量與未來展望，帶大家一起思考這項技術對我們生活的影響！", "sessions_count": 1, "sessions": [{"session_name": "台灣如果有基因編輯的食品，你會吃嗎？", "time": "10/17 14:00 -10/17 15:00", "speaker": "謝明勳研究員", "sub_location": "1樓A134會議室", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "554", "title": "探索植微，解鎖未來", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/554/1788230528789.jpg", "url": "https://openhouse.sinica.edu.tw/events/554", "mode": "實體活動", "need_apply": "不需報名", "organizer": "植物暨微生物學研究所", "group_name": "生命科學", "event_type": "互動體驗", "target": "全年齡", "location": "植物暨微生物學研究所", "lat": "25.0425065996435", "lng": "121.615270342811", "coordinates": "25.0425065996435, 121.615270342811", "map_url": "https://maps.google.com?q=25.0425065996435,121.615270342811", "contact_person": "謝宜真", "contact_phone": "", "contact_email": "", "notes": "", "description": "探索植微，解鎖未來！植微開放日闖關大作戰\n準備好化身「科學學霸」，深入精彩的植物微觀世界了嗎？\n今年我們在每個展示攤位都精心準備了專屬科學考題！只要跟著題目逛攤位、動腦思考，不僅能汲取滿滿的科學新知，完成蓋章任務還能把獨家限量好禮帶回家！\n馬上到本所大門口領取你的「植物密碼卡」，開啟闖關之旅吧！\n【闖關拿好禮三步驟】\n閱讀小卡題目：翻開你的植物密碼卡，看看各個攤位藏了什麼有趣的科學問題！\n闖關蓋章：直奔對應的研究攤位或核心實驗室，認真聽解說或憑實力回答問題，即可獲得攤位專屬印章一枚！\n解鎖紀念品：完成集章，即可至服務台兌換獨家限量紀念品！\n【植物密碼卡限量發放時段】\n上午場：09:00、10:00\n下午場：13:00、14:00\n(手腳要快！每時段數量有限，發完為止喔！)", "sessions_count": 1, "sessions": [{"session_name": "探索植微，解鎖未來", "time": "10/17 09:00 -10/17 16:00", "speaker": "植微所行政團隊", "sub_location": "植微所1樓", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "553", "title": "善惡之\"根\"：植物微生物相", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/553/%E5%AE%98%E7%B6%B2-KWlab.jpg", "url": "https://openhouse.sinica.edu.tw/events/553", "mode": "實體活動", "need_apply": "不需報名", "organizer": "植物暨微生物學研究所", "group_name": "生命科學", "event_type": "成果展示", "target": "全年齡", "location": "農業科技大樓", "lat": "25.0429922120068", "lng": "121.614966712417", "coordinates": "25.0429922120068, 121.614966712417", "map_url": "https://maps.google.com?q=25.0429922120068,121.614966712417", "contact_person": "謝宜真", "contact_phone": "", "contact_email": "", "notes": "", "description": "善惡之「根」：植物微生物相\n你知道植物的根部其實藏著一個龐大的微生物世界嗎？\n就像人類腸道有益生菌與壞菌一樣，植物根系周圍也住著各式各樣的微生物。有的能保護植物成長，有的則可能引發病害。究竟植物是如何與這群微生物互動？這群「地下鄰居」又如何影響植物的健康？歡迎蒞臨參觀了解！\n(本活動壁報展示及相關資訊由 植微所 馬家威助研究員及研究團隊提供)", "sessions_count": 1, "sessions": [{"session_name": "善惡之\"根\"：植物微生物相", "time": "10/17 09:00 -10/17 16:00", "speaker": "", "sub_location": "農科大樓1樓", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "552", "title": "微藻與其他微生物的交互作用", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/552/%E5%AE%98%E7%B6%B2-KClab.jpg", "url": "https://openhouse.sinica.edu.tw/events/552", "mode": "實體活動", "need_apply": "不需報名", "organizer": "植物暨微生物學研究所", "group_name": "生命科學", "event_type": "成果展示", "target": "全年齡", "location": "農業科技大樓", "lat": "25.0429922120068", "lng": "121.614966712417", "coordinates": "25.0429922120068, 121.614966712417", "map_url": "https://maps.google.com?q=25.0429922120068,121.614966712417", "contact_person": "謝宜真", "contact_phone": "", "contact_email": "", "notes": "", "description": "🦠 微藻與其他微生物的交互作用\n微藻是海洋與陸地生態系中不可或缺的生力軍，但在自然界中，牠們從不孤單！\n從海洋到淡水，微藻與周遭的細菌、病毒等微生物時刻進行著複雜的互動——有些是互利共生的好夥伴，有些則是競爭甚至寄生的對手。究竟這些微小的交互作用如何影響整個生態系與地球環境？歡迎蒞臨展區一探究竟！\n(本活動壁報展示及相關資訊由 植微所 顧銓副研究員及研究團隊提供)", "sessions_count": 1, "sessions": [{"session_name": "微藻與其他微生物的交互作用", "time": "10/17 09:00 -10/17 16:00", "speaker": "", "sub_location": "農科大樓1樓", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "551", "title": "五星好評微觀外送員：DNA 外送中，擋路細菌請小心！", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/551/%E5%AE%98%E7%B6%B2-%E8%B3%B4%E7%88%BE%E7%8F%89lab.jpg", "url": "https://openhouse.sinica.edu.tw/events/551", "mode": "實體活動", "need_apply": "不需報名", "organizer": "植物暨微生物學研究所", "group_name": "生命科學", "event_type": "成果展示", "target": "全年齡", "location": "植物暨微生物學研究所", "lat": "25.0425065996435", "lng": "121.615270342811", "coordinates": "25.0425065996435, 121.615270342811", "map_url": "https://maps.google.com?q=25.0425065996435,121.615270342811", "contact_person": "謝宜真", "contact_phone": "", "contact_email": "", "notes": "", "description": "🛵 五星好評微觀外送員：DNA 外送中，擋路細菌請小心！\n你知道微生物世界也有專屬的「外送服務」嗎？\n在微觀世界裡，基因（DNA）的傳遞就像下單外送一樣！有些微觀外送員能穿梭在微生物之間，將關鍵的 DNA 封包精準送到目的地。這項神奇的外送機制不僅讓基因流動，還能左右細菌之間的攻防戰！究竟這群「五星好評外送員」是怎麼運作的？擋路的細菌又該如何小心？歡迎蒞臨展區一探究竟！\n(本活動壁報展示及相關資訊由 植微所 賴爾珉研究員及研究團隊提供)", "sessions_count": 1, "sessions": [{"session_name": "五星好評微觀外送員：DNA 外送中，擋路細菌請小心！", "time": "10/17 09:00 -10/17 16:00", "speaker": "賴爾珉研究員及研究團隊", "sub_location": "植微所1樓 106室", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "550", "title": "跨越植物、真菌與人類——用生物資訊解密生命的多層訊息", "image_url": "https:// %A1%A8%E5%9C%96.jpg", "url": "https://openhouse.sinica.edu.tw/events/424", "mode": "實體活動", "need_apply": "不需報名", "organizer": "近代史研究所", "group_name": "人文社會科學", "event_type": "互動體驗", "target": "全年齡", "location": "近史所檔案館", "lat": "25.0407185190482", "lng": "121.615079799248", "coordinates": "25.0407185190482, 121.615079799248", "map_url": "https://maps.google.com?q=25.0407185190482,121.615079799248", "contact_person": "林明宜", "contact_phone": "", "contact_email": "", "notes": "", "description": "1937年，戰火逼近校園。圖書要裝箱、儀器要上船，整所大學連同師生，甚至農學院的牲畜，都要在砲火下搬到千里之外；而且，課不能停。\n「烽火遷校路」遊戲，把這段路交到你手上。鋪設一段道路，就是接起一段遷校之路。敵機在頭頂盤旋，時間一秒一秒倒數；你必須依照檔案記載的站序規劃道路，讓護送車隊從原校址出發，依序通過每個必經站，平安抵達大後方的戰時校址。\n九所學校、九條路線、四種難度：中央大學搬得最從容，同濟大學六年搬了六次，西南聯大師生更徒步三千五百里走到昆明。每平安護送一所學校，他們的遷徙路線與故事就會在地圖上緩緩展開。\n闖關之餘，會場還有五款遊戲等你挑戰：\n🐝「近代有醫道，養生問古人」：射下小蜜蜂，接住藏在蜂巢裡的養生智慧。\n🐍「時空蛇行-跨世紀的語言探險」：鑽進時光隧道，追著語言的百年變化跑。\n📖「近代史小學堂」：大事件輕鬆學，原來歷史這麼有戲。\n🖊️「譚文解字-草書連連看」：龍飛鳳舞的草書，你能認出幾個字？\n🗺️「到上海了嗎?-漫遊百年老地圖」：踏進百年前的上海街頭，讓老地標一一浮現。\n八十多年前，他們絡繹於途、弦歌不輟；這個秋天，換你來走這條路。", "sessions_count": 1, "sessions": [{"session_name": "絡繹不絕，弦歌不輟", "time": "10/17 09:00 -10/17 16:00", "speaker": "", "sub_location": "大廳入口", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "397", "title": "玩遊戲學經濟：王牌交易所", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/397/%E7%8E%A9%E9%81%8A%E6%88%B2%E6%B5%B7%E5%A0%B1_%E5%8C%97.png", "url": "https://openhouse.sinica.edu.tw/events/397", "mode": "實體活動", "need_apply": "需報名", "organizer": "經濟研究所", "group_name": "人文社會科學", "event_type": "互動體驗", "target": "國中/12歲以上", "location": "經濟研究所", "lat": "25.0403030742986", "lng": "121.617239292969", "coordinates": "25.0403030742986, 121.617239292969", "map_url": "https://maps.google.com?q=25.0403030742986,121.617239292969", "contact_person": "莊孟君", "contact_phone": "", "contact_email": "", "notes": "請於報到時間前完成報到，逾時名額將釋出予現場候補者", "description": "「玩遊戲學經濟：王牌交易所」透過有趣的撲克牌交易遊戲，帶你在互動與競賽中親身體驗經濟學！遊戲中，你將與不同的交易對象交換手中的牌，想辦法創造更高的價值，從中理解為什麼自願交易能讓雙方互蒙其利，並觀察交易範圍、地理位置、資訊與時間等條件，如何影響交易機會與最終成果。\n隨著遊戲中的「市場」逐漸擴大，你會發現：即使資源總量沒有增加，透過交換與重新配置，也可能創造更多價值。我們也將從遊戲經驗出發，帶你認識交易利益、交易成本、市場範圍、國際貿易與全球化等重要經濟學概念，進一步思考科技進步與國際貿易如何降低交易障礙、增加選擇機會，以及為社會與個人帶來哪些影響。\n不需要任何經濟學基礎，只要帶著好奇心就能輕鬆參加！歡迎邀請朋友一起來體驗，在遊戲中邊玩邊學、發現生活中的經濟學。參加活動還可取得研習證明及精美參加獎，機會難得，千萬別錯過！", "sessions_count": 4, "sessions": [{"session_name": "玩遊戲學經濟：王牌交易所", "time": "10/17 09:00 -10/17 09:45", "speaker": "", "sub_location": "1樓 B110、C103、C101會議室", "limit": "100 人", "note": "請於8:50前完成報到，逾時者，名額將釋出給現場候補者"}, {"session_name": "玩遊戲學經濟：王牌交易所", "time": "10/17 10:00 -10/17 10:45", "speaker": "", "sub_location": "1樓 B110、C103、C101會議室", "limit": "100 人", "note": "請於9:50前完成報到，逾時者，名額將釋出給現場候補者"}, {"session_name": "玩遊戲學經濟：王牌交易所", "time": "10/17 14:00 -10/17 14:45", "speaker": "", "sub_location": "1樓 B110、C103、C101會議室", "limit": "100 人", "note": "請於13:50前完成報到，逾時者，名額將釋出給現場候補者"}, {"session_name": "玩遊戲學經濟：王牌交易所", "time": "10/17 15:00 -10/17 15:45", "speaker": "", "sub_location": "1樓 B110、C103、C101會議室", "limit": "100 人", "note": "請於14:50前完成報到，逾時者，名額將釋出給現場候補者"}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "443", "title": "王世杰紀念室參觀 (含歐美所圖書館一樓參觀)", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/443/%E7%8E%8B%E4%B8%96%E6%9D%B0.jpg", "url": "https://openhouse.sinica.edu.tw/events/443", "mode": "實體活動", "need_apply": "不需報名", "organizer": "歐美研究所", "group_name": "人文社會科學", "event_type": "參觀導覽", "target": "全年齡", "location": "歐美研究所", "lat": "25.0396349912772", "lng": "121.615643684265", "coordinates": "25.0396349912772, 121.615643684265", "map_url": "https://maps.google.com?q=25.0396349912772,121.615643684265", "contact_person": "吳慧中", "contact_phone": "", "contact_email": "", "notes": "", "description": "王世杰（1891-1981）是中央研究院第四任院長（1962-1970），是臺灣美國研究的推動者，也是美國文化研究所（歐美研究所的前身）的創辦人，歐美研究所於2022年底成立王世杰紀念室，藉由史蹟再現王世杰篳路藍縷開創美國文化研究與臺美學術交流的時代意義。", "sessions_count": 1, "sessions": [{"session_name": "王世杰紀念室參觀 常生活應用", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/463/2026OpenHouse_%E6%B4%BB%E5%8B%95%E4%BB%A3%E8%A1%A8%E5%9C%96-1.jpg", "url": "https://openhouse.sinica.edu.tw/events/463", "mode": "實體活動", "need_apply": "不需報名", "organizer": "資訊科學研究所", "group_name": "數理科學", "event_type": "演講座談", "target": "高中/15歲以上", "location": "資訊科學研究所", "lat": "25.0411086989842", "lng": "121.614729694814", "coordinates": "25.0411086989842, 121.614729694814", "map_url": "https://maps.google.com?q=25.0411086989842,121.614729694814", "contact_person": "陳冠文", "contact_phone": "", "contact_email": "", "notes": "", "description": "多模態語言模型是現今AI最重要的應用之一，一旦完成研發，它可以應用來執行居家照護、保全業務、及公共場域之犯罪防治。多模態的意思是結合聲音、語言、影像、視訊等分析能力，讓系統在邊緣端 (edge)執行各種任務，本所多位研究員銜國科會主委之命，負責執行這項關乎未來5-10年臺灣百工百業發展的任務。", "sessions_count": 1, "sessions": [{"session_name": "多模態語言模型及其日常生活應用", "time": "10/17 09:30 -10/17 10:00", "speaker": "廖弘源博士", "sub_location": "新館1樓106演講廳", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "350", "title": "生命來自外太空嗎?", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/350/%E6%88%AA%E5%9C%96_2026-08-10_%E4%B8%8A%E5%8D%8810.17.42.png", "url": "https://openhouse.sinica.edu.tw/events/350", "mode": "實體活動", "need_apply": "不需報名", "organizer": "原子與分子科學研究所", "group_name": "數理科學", "event_type": "演講座談", "target": "高中/15歲以上", "location": "人文社會科學館", "lat": "25.041058172156", "lng": "121.611454824135", "coordinates": "25.041058172156, 121.611454824135", "map_url": "https://maps.google.com?q=25.041058172156,121.611454824135", "contact_person": "林伊雯", "contact_phone": "", "contact_email": "", "notes": "", "description": "倪其焜博士為質譜技術專家，其研究團隊認知到構成生命的巨分子之一 : 碳水化合物，至近期仍沒有一個快速有效的初級結構的鑑定方式，因此從2017 年起全力投入這個重要課題的研究。構成生命的三類巨分子 : 核糖核酸，蛋白質，及碳水化合物，至今只有碳水化合物依然沒有可靠快速的方法可以決定其初級結構。碳水化合物初級結構的鑑 定，傳統上是使用各種化學反應法和酵素，或是使用核磁共振光譜，但這兩種方法都耗時、耗樣品。 質譜儀有很高的靈敏度，所需的樣品非常少，但是傳統質譜法只能決定碳水化合物醣酐鍵的位置，無法決定變旋異構物、單醣的立體結構等。 倪博士實驗室研究團隊，結合實驗，量子化學計算，和化學動力學理論，研究碳水化合物在氣相的分解機制，並進一步利用這些分解機制，提出一個全新的質譜法，名為「邏輯演繹序列串聯質譜法」，可以鑑定醣酐鍵的位置、變旋異構物、單醣的立體結構等。 倪博士實驗室開發的方法，是目前全世界所有質譜法中，唯一可以鑑定寡糖完全初級結構的質譜方法。最近倪博士團隊將這個方法應用在各種生物體中，發現了前所未見的新寡糖。", "sessions_count": 2, "sessions": [{"session_name": "生命來自外太空嗎?", "time": "10/17 09:30 -10/17 10:00", "speaker": "倪其焜", "sub_location": "4樓交誼廳", "limit": "", "note": ""}, {"session_name": "生命來自外太空嗎?", "time": "10/17 15:00 -10/17 15:30", "speaker": "倪其焜", "sub_location": "4樓交誼廳", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "349", "title": "當神經科學遇上虛擬實境與人工智慧", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/349/10.17%E6%BC%94%E8%AC%9B.png", "url": "https://openhouse.sinica.edu.tw/events/349", "mode": "實體活動", "need_apply": "不需報名", "organizer": "分子生物研究所", "group_name": "生命科學", "event_type": "演講座談", "target": "全年齡", "location": "分子生物研究所", "lat": "25.0434841381771", "lng": "121.613802537718", "coordinates": "25.0434841381771, 121.613802537718", "map_url": "https://maps.google.com?q=25.0434841381771,121.613802537718", "contact_person": "李昕瑜", "contact_phone": "", "contact_email": "", "notes": "", "description": "🧬 分生所科普活動來囉！\n我們誠摯邀請您參加由黃國華老師主講的精彩科普演講！\n時間：10月17日（星期六）下午2:00–3:00\n地點：中央研究院 分子生物研究所\n🎤 演講主題：\n「當神經科學遇上虛擬實境與人工智慧」\n聽起來好奇又有趣吧？不管你是熱愛科學，還是想帶家人朋友來場知性又有趣的週末活動，這場演講都不容錯過！\n🎁演講結束後，還有機會獲得印有本所研究領域中可愛的Q版生物模式圖案環保摺疊扇一只！（數量有限，送完為止）\n👨‍👩‍👧‍👦 活動老少咸宜，歡迎大家一起來探索科學的趣味世界！", "sessions_count": 1, "sessions": [{"session_name": "當神經科學遇上虛擬實境與人工智慧", "time": "10/17 14:00 -10/17 15:00", "speaker": "黃國華", "sub_location": "分子生物研究所1樓演講廳", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "566", "title": "荒漠尋菌事件簿", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/566/%E8%8D%92%E6%BC%A0%E5%B0%8B%E8%8F%8C%E4%BA%8B%E4%BB%B6%E7%B0%BF.jpg", "url": "https://openhouse.sinica.edu.tw/events/566", "mode": "實體活動", "need_apply": "不需報名", "organizer": "生物多樣性研究中心", "group_name": "生命科學", "event_type": "演講座談", "target": "全年齡", "location": "跨領域科技研究大樓", "lat": "25.045049", "lng": "121.613903", "coordinates": "25.045049, 121.613903", "map_url": "https://maps.google.com?q=25.045049,121.613903", "contact_person": "葉欣宜", "contact_phone": "", "contact_email": "", "notes": "", "description": "由本中心湯森林特聘研究員帶來精彩的科普演講", "sessions_count": 1, "sessions": [{"session_name": "荒漠尋菌事件簿", "time": "10/17 14:00 -10/17 15:00", "speaker": "湯森林特聘研究員", "sub_location": "1樓演講廳", "limit": "", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "339", "title": "可再生能源、土地與當代環境觀──來自臺灣、印度與挪威的故事", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/339/%E5%8F%AF%E5%86%8D%E7%94%9F%E8%83%BD%E6%BA%90_%E5%9C%9F%E5%9C%B0%E8%88%87%E7%95%B6%E4%BB%A3%E7%92%B0%E5%A2%83%E8%A7%80__%E4%BE%86%E8%87%AA%E8%87%BA%E7%81%A3_%E5%8D%B0%E5%BA%A6%E8%88%87%E6%8C%AA%E5%A8%81%E7%9A%84%E6%95%85%E4%BA%8B_%E6%9E%97%E6%B1%9D%E7%BE%BD_%E6%96%B0_.png", "url": "https://openhouse.sinica.edu.tw/events/339", "mode": "實體活動", "need_apply": "不需報名", "organizer": "民族學研究所", "group_name": "人文社會科學", "event_type": "演講座談", "target": "國中/12歲以上", "location": "民族學研究所", "lat": "25.0392728775304", "lng": "121.616941859113", "coordinates": "25.0392728775304, 121.616941859113", "map_url": "https://maps.google.com?q=25.0392728775304,121.616941859113", "contact_person": "王明彥", "contact_phone": "", "contact_email": "", "notes": "", "description": "近年來，面對氣候變遷，各地積極發展風力、太陽能及水力等可再生能源，希望兼顧環境永續與能源需求。然而，能源設施的興建不只是技術問題，也會改變土地利用方式，以及人與自然之間的關係。\n雖然臺灣、印度與挪威擁有不同的自然環境、文化背景與歷史經驗，但都共同面臨能源開發與土地利用之間的挑戰。透過不同研究場域的民族誌比較，我們可以看見，人們如何在各自的文化脈絡中理解土地、環境與未來，也重新思考能源轉型所帶來的改變。\n本次演講將分享講者以臺灣芳苑、印度東北阿魯納洽爾邦，以及挪威中西部佛森半島為研究地點的民族學研究，透過蚵農、原住民族、牧人等不同社群的生活經驗，以及他們與動物、信仰和土地互動的故事，帶領大家認識不同社會如何面對能源開發帶來的挑戰，並一起思考能源、土地與環境之間的關係，以及人與自然如何共同生活。", "sessions_count": 1, "sessions": [{"session_name 98%E7%A8%8B%E5%AE%A52026.png", "url": "https://openhouse.sinica.edu.tw/events/346", "mode": "實體活動", "need_apply": "需報名", "organizer": "民族學研究所", "group_name": "人文社會科學", "event_type": "互動體驗", "target": "國中/12歲以上", "location": "民族學研究所", "lat": "25.0392728775304", "lng": "121.616941859113", "coordinates": "25.0392728775304, 121.616941859113", "map_url": "https://maps.google.com?q=25.0392728775304,121.616941859113", "contact_person": "王明彥", "contact_phone": "", "contact_email": "", "notes": "", "description": "「編織，是原住民族的文化，亦是扎根於山林的生活樣貌。」\n在傳統部落日常中，看似平凡的苧麻，經過剝皮、刮麻、捻線到紡紗等繁複工序，便蛻變成貫穿部落生命力的堅韌線材。女性細緻地將麻絲撚成柔軟而有韌性的線，織成斑斕美麗的布匹，再細心縫製成溫暖一家人的衣服；男性則展現力量與實用智慧，透過搓線處理，將麻絲製作成承載重物與日常獵具的 wakil（腰帶、肩背帶）。\n而苧麻，在不同手溫的轉化下，分化出屬於「女人的線」與「男人的線」，交織出族群的生生不息。\n本次活動將帶領大家深入探索苧麻纖維的多元用途。在『文化微講座』中，我們將快速解密傳統製線工序，認識「男線」與「女線」在處理技法上的智慧與差異；隨後，你將製作『苧麻纖維鑰匙圈』，親自體驗搓繩與纏綁的工藝手感，將苧麻轉化為別具泰雅文化特色與溫度的手作品，把這份來自山林的傳統祝福，繫進你的日常生活中。", "sessions_count": 1, "sessions": [{"session_name": "線裡的Tayal記憶－苧麻纖維鑰匙圈製作", "time": "10/17 14:30 -10/17 16:00", "speaker": "高程宥（Ayung Yukan，民族所部落服務獎助計畫學員）", "sub_location": "1樓大廳", "limit": "20 人", "note": ""}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "432", "title": "幕府將軍請簽收！1728年的大象快遞", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/432/%E8%B1%A1%E4%B9%8B%E7%B9%AA%E5%B7%BB%E7%89%A9_%E5%B1%80%E9%83%A8__%E5%8A%A0%E5%9C%96%E8%AA%AA_%E5%90%B3%E6%94%BF%E7%B7%AF_.jpg", "url": "https://openhouse.sinica.edu.tw/events/432", "mode": "實體活動", "need_apply": "不需報名", "organizer": "近代史研究所", "group_name": "人文社會科學", "event_type": "演講座談", "target": "高中/15歲以上", "location": "近史所檔案館", "lat": "25.0407185190482", "lng": "121.615079799248", "coordinates": "25.0407185190482, 121.615079799248", "map_url": "https://maps.google.com?q=25.0407185190482,121.615079799248", "contact_person": "李怡嬅", "contact_phone": "", "contact_email": "", "notes": "演講無需報名，開放自由參加", "description": "如果你是三百年前的日本幕府將軍，突然想要看一頭「大象」，你該怎麼辦？\n事實上，日本本土的諾氏古菱齒象早在兩萬四千年前就已經滅絕了。到了江戶時代，第八代幕府將軍德川吉宗（1684-1751）卻對世界充滿好奇，下達了一張超級棘手的海外訂單：「幫我買隻大象來！」\n為了解決將軍的願望，長崎的官員動員了當時的海上物流網絡，透過穿梭海上的唐船商人，大老遠跑到廣南（今日的越南）買了大象，展開一場驚心動魄的跨海大快遞。這隻巨大無比的珍獸，每天需要吃掉驚人數量的食物，牠到底是如何橫跨季風亞洲的海域順利抵達日本？而在這場不可思議的跨國動物外交背後，又隱藏著什麼樣的東亞歷史與海洋貿易奧秘？\n另，為擴大今年科普演講主題「History in Motion：近代東亞的人群與移動」的影響力，圖書館將錄製講座內容並編製Podcast，日後可隨時於網站線上收聽，提供民眾更容易接觸深入淺出的研究成果。延續實體活動的效益，也提升學術專業內容的可近性與傳播力，展現近史所推動科普資源的積極行動。", "sessions_count": 1, "sessions": [{"session_name": "幕府將軍請簽收！1728年的大象快遞", "time": "10/17 14:30 -10/17 15:20", "speaker": "吳政緯", "sub_location": "1樓第一會議室", "limit": "", "note": "演講無需報名，開放自由參加"}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "580", "title": "如果晚清有Instagram：小說、畫報與新視覺技術", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/580/06.%E5%A6%82%E6%9E%9C%E6%99%9A%E6%B8%85%E6%9C%89Instagram_%E5%B0%8F%E8%AA%AA_%E7%95%AB%E5%A0%B1%E8%88%87%E6%96%B0%E8%A6%96%E8%A6%BA%E6%8A%80%E8%A1%93.jpg", "url": "https://openhouse.sinica.edu.tw/events/580", "mode": "實體活動", "need_apply": "需報名", "organizer": "中國文哲研究所", "group_name": "人文社會科學", "event_type": "演講座談", "target": "高中/15歲以上", "location": "中國文哲研究所", "lat": "25.0418581778251", "lng": "121.612303749931", "coordinates": "25.0418581778251, 121.612303749931", "map_url": "https://maps.google.com?q=25.0418581778251,121.612303749931", "contact_person": "張穩蘋", "contact_phone": "", "contact_email": "", "notes": "時間：14:30-15:30 採線上報名，限制40人", "description": "1.活動時間：14:30-15:30\n2.採線上報名，限制40人\n3.有獎徵答\n想像一個沒有手機、沒有網路，甚至很少看得到照片的世界──100多年前，攝影、畫報、幻燈片和電影突然出現，就像今天的社群媒體與AI影像一樣，改變了人們「看世界」的方式、也改變了小說家怎麼說故事。\n這場演講將帶大家穿越晚清，看看新奇的視覺科技如何走進文學，開啟一場文字與影像的奇妙碰撞！", "sessions_count": 1, "sessions": [{"session_name": "如果晚清有Instagram：小說、畫報與新視覺技術", "time": "10/17 14:30 -10/17 15:30", "speaker": "楊中薇博士", "sub_location": "2樓交誼廳", "limit": "40 人", "note": "時間：14:30-15:30 採線上報名，限制40人"}], "days_held": ["10/17"], "days_held_display": "10/17", "theme": "院區開放日"}, {"event_id": "538", "title": "從數據看世界: 耳熟慣見，卻又 ，也是自由了：胡適及其友人的婚戀人生", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/441/%E5%8D%97%E9%83%A8%E9%99%A2%E5%8D%80%E9%96%8B%E6%94%BE%E6%97%A5%E6%B4%BB%E5%8B%95%E4%BB%A3%E8%A1%A8%E5%9C%9620260627%E6%9B%B4%E6%96%B0.jpg", "url": "https://openhouse.sinica.edu.tw/events/441", "mode": "實體活動", "need_apply": "不需報名", "organizer": "胡適紀念館", "group_name": "人文社會科學", "event_type": "參觀導覽", "target": "全年齡", "location": "南部院區", "lat": "22.92441", "lng": "120.29188", "coordinates": "22.92441, 120.29188", "map_url": "https://maps.google.com?q=22.92441,120.29188", "contact_person": "李朝順", "contact_phone": "", "contact_email": "", "notes": "", "description": "五四新文化運動中，除了廣為人們討論的德先生（民主）與賽先生（科學）之外，婚姻是一個幾乎被遺忘，卻更加貼近生活的視野。藉由胡適、陳衡哲、趙元任、傅斯年、徐志摩以及魯迅的婚姻，可以清楚地看見現在想當然耳的婚姻自主，以及男女平權都經過血淋淋的爭取，而非一蹴可幾。雖然現在所言「遺棄」、「離婚」，以及「婚外情」等議題在歷史上屢見不鮮，但是在舊制度與新觀念衝擊最強烈的五四新文化運動時代，卻掀起巨大的波瀾，從知識人面對婚姻人生的無力、無奈或無情，到我們認知的天經地義、理所當然，這條路並不輕鬆，軌跡更值得重訪。胡適紀念館誠摯邀請大家來到中央研究院南部院區，重新看看這段曲折但是有趣的故事。\n🕰️2026年11月14日展區開放時間：09:00-16:00\n📢導覽時間：10:00-10:40；14:00-14:40\n🧍導覽人員：岑丞丕", "sessions_count": 1, "sessions": [{"session_name": "情願不自由，也是自由了：胡適及其友人的婚戀人生", "time": "11/14 09:00 -11/14 16:00", "speaker": "岑丞丕", "sub_location": "綜合大樓大廳", "limit": "", "note": ""}], "days_held": ["11/14"], "days_held_display": "11/14", "theme": "南部院區開放日"}, {"event_id": "560", "title": "「光能變奏曲」—手作你的太陽能小世界", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/560/%E5%A4%AA%E9%99%BD%E8%83%BD.jpg", "url": "https://openhouse.sinica.edu.tw/events/560", "mode": "實體活動", "need_apply": "需報名", "organizer": "關鍵議題研究中心", "group_name": "跨學組研究中心", "event_type": "互動體驗", "target": "國小/6歲以上", "location": "南部院區", "lat": "22.92441", "lng": "120.29188", "coordinates": "22.92441, 120.29188", "map_url": "https://maps.google.com?q=22.92441,120.29188", "contact_person": "盧音翰", "contact_phone": "", "contact_email": "", "notes": "國小6歲以上/每場次限8組親子，至少1位家長陪同", "description": "太陽是如何化為源源不絕的電力？光除了帶來溫暖，還能幫我們做什麼？\n今年學術中心開放日互動工作坊！結合科普導覽與實作體驗，帶領大人與孩子親手摸索光電轉換的奧秘。\n本次活動針對不同場次，在 90 分鐘的親手實作中，由爸媽與孩子攜手組裝，將微光轉化為動能。一起成為探索未來的「小小光電科學家」\n*晨光場（09:00 – 10:30）｜星際探索：微光太陽系\n_實作套件：太陽能八大行星\n_場次簡介：把浩瀚宇宙縮小到桌上！本場次將帶領大家了解太陽能如何帶動多重齒輪機構，透過親手組裝，讓太陽能板吸收光能、驅動八大行星圍繞太陽公轉，體驗宏觀的天文與光能科學。\n*上午場（10:45 – 12:15）｜生機蓬勃：光能小野豬\n_實作套件：太陽能野豬\n_場次簡介：光也能讓機械動物活靈活現！專為親子入門設計的齒輪組裝課程，讓孩子觀察太陽能板如何捕捉光線並轉換為機械動力，看著自己組裝的小野豬在光照下邁開步伐，感受滿滿的動手成就感！\n*午後場（13:30 – 15:00）｜永續美學：光的旋轉永生花\n_實作套件：太陽能永生花\n_場次簡介：將綠能科技融入生活美學！本場次帶領大家探索微光感應技術，當光線灑落，永生花便優雅旋轉，讓綠能不再只是冷冰冰的公式，而是美化生活的溫暖力量。\n參與對象與報名規範\n1. 參與對象與家長陪同\n年齡限制：本活動主要以 6 歲以上至 12 歲以下之小學生為主。\n家長陪同：為了孩子的安全，活動當天務必安排一位家長全程陪同，敬請配合。請於場次開始前5分鐘報到。\n2. 帳號與報名注意事項\n孩童獨立帳號：因系統設定一個帳號僅對應一個名額，小朋友也需要申請獨立帳號才能進行報名登記。\n名額與抽籤機制：本活動採隨機抽籤制，每場次限 8 位小朋友（每位需 1 位家長陪同，共 8 組親子）。若您希望全家（多位家人）一同參與，建議可選擇其他「不須報名」的開放活動。", "sessions_count": 3, "sessions": [{"session_name": "「光能變奏曲」—手作你的太陽能小世界", "time": "11/14 09:00 -11/14 10:30", "speaker": "", "sub_location": "關鍵中心一樓大廳", "limit": "8 人", "note": "晨光場（09:00 – 10:30）｜星際探索：微光太陽系"}, {"session_name": "「光能變奏曲」—手作你的太陽能小世界", "time": "11/14 10:45 -11/14 12:15", "speaker": "", "sub_location": "關鍵中心一樓大廳", "limit": "8 人", "note": "上午場（10:45 – 12:15）｜生機蓬勃：光能小野豬"}, {"session_name": "「光能變奏曲」—手作你的太陽能小世界", "time": "11/14 13:30 -11/14 15:00", "speaker": "", "sub_location": "關鍵中心一樓大廳", "limit": "8 人", "note": "午後場（13:30 – 15:00）｜永續美學：光的旋轉永生"}], "days_held": ["11/14"], "days_held_display": "11/14", "theme": "南部院區開放日"}, {"event_id": "462", "title": "MOSEA出任務:尋找海中的隱形寶藏 MO-SEA！MO-SEA！WHAT DO YOU SEA?", "image_url": "https://d2x1gov9yn7zyc.cloudfront.net/openhouse2026/uploads/website/2/event/image/462/taimos.jpg", "url": "https://openhouse.sinica.edu.tw/events/462", "mode": "實體活動", "need_apply": "需報名", "organizer": "關鍵議題研究中心", "group_name": "數理科學", "event_type": "互動體驗", "target": "全年齡", "location": "南部院區", "lat": "22.92441", "lng": "120.29188", "coordinates": "22.92441, 120.29188", "map_url": "https://maps.google.com?q=22.92441,120.29188", "contact_person": "蔡佩蓉", "contact_phone": "", "contact_email": "", "note       return s.replace(/[\s\u3000\u00a0\u30fb\u00b7\u2014\u2500\uff0d\-:：!！\?？\.,，\(\)（）\-_—]+/g, '').toLowerCase();

    function formatCleanTime(timeStr) {

      clean = clean.replace(/(\d{1,2}\/\d{1,2})\s*(\d{1,2}:\d{2})\s*-\s*\1\s*(\d{1,2}:\d{2})/, '$1 $2~$3');

      if (mDate) {

        dateKey = `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}`;
      } else {
        const mFullDate = timeStr.match(/(\d{4}-\d{2}-\d{2})/);

    function getEventRegistrationInfo(ev) {

      const evDays = ev.days_held || [];

      if (evDays.length > 0) {

          if (item.date) {

            if (m && evDays.some(d => d.replace('/', '-') === m[1])) return true;

          return false;
        });
        if (matchedByDate.length > 0) {

    function getSessionRegistrationStat(ev, sessionObj, sessionIndex) {
      const regInfo = ev.regInfo;
      if (!regInfo || !regInfo.hasStats || !regInfo.sessions || regInfo.sessions.length === 0) {
        return null;

      const evSessions = ev.sessions || [];

        const candidates = regItems.filter(r => isSame(extractTimeKeys(r.raw_time || '')));
        if (candidates.length > 0) return pickByRank(candidates, isSame);
      }

      if (sTimeKeys.start) {

      ev.regInfo = getEventRegistrationInfo(ev);
    });

    // 依各場次實際對應到的報名資料，計算活動是否仍有可報名場次與可報名剩餘席位
    allEventsData.forEach(ev => {
      if (!ev.regInfo || !ev.regInfo.hasStats) return;
      const availStats = (ev.sessions || [])
        .map(s => getSessionRegistrationStat(ev, s))
        .filter(isStatAvailable);
      ev.regInfo.hasAvailable = availStats.length > 0;
      ev.regInfo.availableRemain = availStats.reduce((sum, st) => sum + (st.remain || 0), 0);
    });

    // 搜尋用文字：包含活動欄位、聯絡人、舉辦日期 (10/03 與 10/3) 及各場次時間、主講人、位置
    function buildSearchText(ev) {
      if (ev._searchText !== undefined) return ev._searchText;
      const days = ev.days_held || [];
      const shortDays = days.map(d => d.split('/').map(x => String(parseInt(x, 10))).join('/'));
      const sessionText = (ev.sessions || []).map(s => [s.time, s.speaker, s.sub_location, s.session_name].join(' ')).join(' ');
      const parts = [
        ev.title, ev.organizer, ev.location, ev.description, ev.notes, ev.event_id,
        ev.need_apply, ev.event_type, ev.target, ev.group_name, ev.theme, ev.contact_person,
        ev.days_held_display, days.join(' '), shortDays.join(' '), sessionText
      ];
      ev._searchText = parts.filter(v => v !== undefined && v !== null && v !== '').join(' ').toLowerCase();
      return ev._searchText;
    }

    const facilityIconConfig = {
      '接待與服務': { icon: 'fa-circle-info', color: '#ea580c' },
      '餐飲資訊': { icon: 'fa-utensils', color: '#dc2626' },
      '休憩場所': { icon: 'fa-couch', color: '#16a34a' },
      '哺集乳室': { icon: 'fa-baby', color: '#9333ea' },
      '洗手間': { icon: 'fa-restroom', color: '#0284c7' },
      '箱水及飲水機': { icon: 'fa-bottle-water', color: '#0891b2' },
      '免費接駁車': { icon: 'fa-van-shuttle', color: '#d97706' },
      '停車與交通資訊': { icon: 'fa-square-parking', color: '#475569' }
    };

    const map = L.map('map', {
      zoomControl: false,
      maxZoom: 19,
      minZoom: 13
    }).setView([25.0418, 121.6145], 16);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const layerGroupMap = {
      events: L.layerGroup().addTo(map),
      '接待與服務': L.layerGroup(),
      '餐飲資訊': L.layerGroup(),
      '休憩場所': L.layerGroup(),
      '哺集乳室': L.layerGroup(),
      '洗手間': L.layerGroup(),
      '箱水及飲水機': L.layerGroup(),
      '免費接駁車': L.layerGroup(),
      '停車與交通資訊': L.layerGroup()
    };

    const activeLayers = new Set(['events']);
    let currentThemeFilter = 'ALL';
    let lastNankangTheme = 'ALL';
    let currentApplyFilter = 'ALL';
    let currentQuotaFilter = 'ALL'; // 'ALL', 'available' (尚有名額/未額滿), 'overbooked' (已額滿)

    function createBuildingPin(count) {
      let colorClass = 'blue';
      if (count >= 10) colorClass = 'red';
      else if (count >= 5) colorClass = 'orange';

      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="building-pin ${colorClass}"><span class="num">${count}</span></div>`,
        iconSize: [32, 39],
        iconAnchor: [16, 39],
        popupAnchor: [0, -36]
      });
    }

    function createFacilityPin(category) {
      const cfg = facilityIconConfig[category] || { icon: 'fa-location-dot', color: '#475569' };
      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="facility-pin fac-${category}" style="width:28px; height:28px; font-size:12px;"><i class="fa-solid ${cfg.icon}"></i></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function setApplyFilter(val, el) {
      trackEvent('filter_apply_mode', { mode: val });
      currentApplyFilter = val;
      document.querySelectorAll('.apply-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');

      const subRow = document.getElementById('applySubRow');
      if (subRow) {
        if (val === '需報名') {
          subRow.style.display = 'flex';
        } else {
          subRow.style.display = 'none';
          currentQuotaFilter = 'ALL';
          document.querySelectorAll('.apply-sub-btn').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-quota') === 'ALL');
          });
        }
      }

      applyFilters();
    }

    function setQuotaFilter(quotaVal, el) {
      trackEvent('filter_quota_status', { quota: quotaVal });
      currentQuotaFilter = quotaVal;
      document.querySelectorAll('.apply-sub-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      applyFilters();
    }

    // 是否啟用了「場次層級」的篩選 (時段，或需報名下的名額狀態)
    function isSessionFilterActive(timeStart, timeEnd) {
      return timeStart !== 'ALL' || timeEnd !== 'ALL' || (currentApplyFilter === '需報名' && currentQuotaFilter !== 'ALL');
    }

    // 判斷單一場次是否符合目前的時段與名額狀態篩選
    function isSessionVisible(ev, sessionObj, timeStart, timeEnd) {
      if (!isSessionInTimeRange(sessionObj, timeStart, timeEnd)) return false;
      if (currentApplyFilter === '需報名' && currentQuotaFilter !== 'ALL') {
        const stat = getSessionRegistrationStat(ev, sessionObj);
        if (!stat) return false;
        const avail = isStatAvailable(stat);
        return currentQuotaFilter === 'available' ? avail : !avail;
      }
      return true;
    }

    // 取得活動中符合目前篩選的場次 (無場次層級篩選時回傳全部場次)
    function getVisibleSessions(ev, timeStart, timeEnd) {
      const sessions = ev.sessions || [];
      if (!isSessionFilterActive(timeStart, timeEnd)) return sessions;
      return sessions.filter(s => isSessionVisible(ev, s, timeStart, timeEnd));
    }

    // 判斷活動在指定時段內是否仍有可報名場次
    function hasEventQuotaVacancies(ev, timeStart = 'ALL', timeEnd = 'ALL') {
      if (ev.need_apply !== '需報名') return false;
      if (!ev.regInfo || !ev.regInfo.hasStats) return false;
      return (ev.sessions || []).some(s =>
        isSessionInTimeRange(s, timeStart, timeEnd) && isStatAvailable(getSessionRegistrationStat(ev, s))
      );
    }

    // 展開 / 收合過多場次
    function toggleSessions(containerId, btn) {
      const hiddenPart = document.getElementById(containerId);
      if (!hiddenPart) return;
      if (hiddenPart.style.display === 'none' || hiddenPart.style.display === '') {
        hiddenPart.style.display = 'block';
        btn.innerHTML = '收合部分場次 <i class="fa-solid fa-chevron-up"></i>';
      } else {
        hiddenPart.style.display = 'none';
        const total = btn.getAttribute('data-total') || '';
        btn.innerHTML = `展開其餘場次 (共 ${total} 場) <i class="fa-solid fa-chevron-down"></i>`;
      }
    }

    // 判斷場次時間是否符合使用者設定的時段區間 (支援全日開放、跨時段與長時段活動)
    function isSessionInTimeRange(sessionObj, timeStart, timeEnd) {
      if (!sessionObj) return false;
      if (timeStart === 'ALL' && timeEnd === 'ALL') return true;
      const times = (sessionObj.time || '').match(/\d{1,2}:\d{2}/g);
      if (!times || times.length < 2) return true; // 若無明確起訖時間則預設不排除
      const sStart = times[0].padStart(5, '0');
      const sEnd = times[1].padStart(5, '0');

      // 開始時間條件：篩選此時間點後仍有開放／進行中的活動 (即活動結束時間 > timeStart)
      if (timeStart !== 'ALL' && sEnd <= timeStart) return false;

      // 結束時間條件：篩選此時間點前已經開始進行的活動 (即活動開始時間 < timeEnd)
      if (timeEnd !== 'ALL' && sStart >= timeEnd) return false;

      return true;
    }

    // 生成緊湊 RWD 場次列表 HTML (共用於卡片與彈窗)
    function renderCompactSessionsHtml(ev, isPopup = false) {
      const sessions = ev.sessions || [];
      if (sessions.length === 0) {
        return '<div style="color: #64748b; font-size: 11px; padding: 4px;"><i class="fa-regular fa-clock"></i> 時間依現場公告</div>';
      }

      const timeStart = document.getElementById('timeStartSelect')?.value || 'ALL';
      const timeEnd = document.getElementById('timeEndSelect')?.value || 'ALL';
      const isTimeFiltered = isSessionFilterActive(timeStart, timeEnd);
      const onlyTimeFilter = !(currentApplyFilter === '需報名' && currentQuotaFilter !== 'ALL');

      // 若有時段或名額篩選，將符合條件之場次優先排在最前面顯示
      let orderedSessions = [...sessions];
      if (isTimeFiltered) {
        orderedSessions.sort((a, b) => {
          const aMatch = isSessionVisible(ev, a, timeStart, timeEnd) ? 1 : 0;
          const bMatch = isSessionVisible(ev, b, timeStart, timeEnd) ? 1 : 0;
          return bMatch - aMatch;
        });
      }

      const limitVisible = isPopup ? 3 : 3;
      const visibleSessions = orderedSessions.slice(0, limitVisible);
      const hiddenSessions = orderedSessions.slice(limitVisible);
      const uniqueId = `sess_${ev.event_id}_${isPopup ? 'pop' : 'card'}`;

      function renderRow(s, idx) {
        const cleanTime = formatCleanTime(s.time);
        const matchedStat = getSessionRegistrationStat(ev, s, idx);
        const isMatched = isTimeFiltered && isSessionVisible(ev, s, timeStart, timeEnd);

        let statHtml = '';
        if (matchedStat && matchedStat.limit > 0) {
          const isAvail = isStatAvailable(matchedStat);
          const statClass = isAvail ? 'available' : 'overbooked';
          const statText = isAvail
            ? `${getRegisteredCount(matchedStat)}/${matchedStat.limit}人 (餘${matchedStat.remain})`
            : `${getRegisteredCount(matchedStat)}/${matchedStat.limit}人 額滿`;
          const statTitle = isAvail
            ? `本場已登記 ${getRegisteredCount(matchedStat)} 人 / 限額 ${matchedStat.limit} 人 (尚餘 ${matchedStat.remain} 席可報名)`
            : `本場名額已額滿 (已登記 ${getRegisteredCount(matchedStat)} 人 / 限額 ${matchedStat.limit} 人)`;
          statHtml = `
            <span class="session-stat-mini ${statClass}" title="${statTitle}">
              <span class="dot"></span>${statText}
            </span>
          `;
        }

        const extraName = (s.session_name && s.session_name !== ev.title)
          ? `<span style="color:#64748b; font-size:10px; margin-left:4px;">(${s.session_name})</span>`
          : '';

        const matchBadge = isMatched
          ? `<span style="display:inline-flex; align-items:center; gap:2px; font-size:9.5px; background:#dcfce7; color:#15803d; padding:1px 5px; border-radius:4px; font-weight:700; margin-left:5px;"><i class="fa-solid fa-check" style="font-size:8.5px;"></i>${onlyTimeFilter ? '符合時段' : '符合條件'}</span>`
          : '';

        const itemStyle = (isTimeFiltered && !isMatched) ? 'opacity: 0.55;' : '';

        return `
          <div class="session-row-item" style="${itemStyle}">
            <div class="session-time-col" title="${cleanTime}">
              <i class="fa-regular fa-clock"></i>
              <span>${cleanTime}</span>
              ${extraName}
              ${matchBadge}
            </div>
            ${statHtml}
          </div>
        `;
      }

      let html = '<div class="session-list-wrapper">';
      visibleSessions.forEach((s, idx) => {
        html += renderRow(s, idx);
      });

      if (hiddenSessions.length > 0) {
        html += `<div id="${uniqueId}" style="display:none;">`;
        hiddenSessions.forEach((s, idx) => {
          html += renderRow(s, limitVisible + idx);
        });
        html += `</div>`;
        html += `
          <button type="button" class="toggle-sessions-btn" data-total="${sessions.length}" onclick="event.stopPropagation(); toggleSessions('${uniqueId}', this)">
            展開其餘場次 (共 ${sessions.length} 場) <i class="fa-solid fa-chevron-down"></i>
          </button>
        `;
      }

      html += '</div>';
      return html;
    }

    function applyFilters() {
      const searchText = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const groupFilter = document.getElementById('groupSelect')?.value || 'ALL';
      const typeFilter = document.getElementById('typeSelect')?.value || 'ALL';

      // 「從」晚於「到」時自動對調，避免出現無提示的 0 筆結果
      const startSel = document.getElementById('timeStartSelect');
      const endSel = document.getElementById('timeEndSelect');
      if (startSel && endSel && startSel.value !== 'ALL' && endSel.value !== 'ALL' && startSel.value > endSel.value) {
        const s = startSel.value, e = endSel.value;
        if ([...startSel.options].some(o => o.value === e) && [...endSel.options].some(o => o.value === s)) {
          startSel.value = e;
          endSel.value = s;
        }
      }
      const timeStart = startSel?.value || 'ALL';
      const timeEnd = endSel?.value || 'ALL';

      const cardsContainer = document.getElementById('cardsContainer');
      if (!cardsContainer) return;
      cardsContainer.innerHTML = '';

      Object.values(layerGroupMap).forEach(lg => lg.clearLayers());

      const matchedEvents = allEventsData.filter(ev => {
        if (currentThemeFilter !== 'ALL') {
          if (currentThemeFilter === '兒童科普日') {
            const is1003 = (ev.days_held && ev.days_held.includes('10/03')) || (ev.days_held_display || '').includes('10/03');
            if (ev.theme !== '兒童科普日' && !is1003) return false;
          } else if (currentThemeFilter === '院區開放日') {
            const is1017 = (ev.days_held && ev.days_held.includes('10/17')) || (ev.days_held_display || '').includes('10/17');
            if (ev.theme !== '院區開放日' && !is1017) return false;
          } else if (currentThemeFilter === '南部院區開放日') {
            const is1114 = (ev.days_held && ev.days_held.includes('11/14')) || (ev.days_held_display || '').includes('11/14');
            if (!(ev.theme || '').startsWith('南') && !is1114) return false;
          } else {
            if (ev.theme !== currentThemeFilter) return false;
          }
        }

        if (groupFilter !== 'ALL' && (ev.group_name || '') !== groupFilter) return false;
        if (typeFilter !== 'ALL' && (ev.event_type || '') !== typeFilter) return false;

        // 報名方式篩選 (需報名 vs 不需報名)
        if (currentApplyFilter !== 'ALL') {
          if (currentApplyFilter === '需報名') {
            if (ev.need_apply !== '需報名') return false;
          } else if (currentApplyFilter === '不需報名') {
            if (ev.need_apply === '需報名') return false;
          }
        }

        // 場次層級篩選 (時段、名額狀態)：活動中至少要有一個場次同時符合
        if (isSessionFilterActive(timeStart, timeEnd)) {
          if (getVisibleSessions(ev, timeStart, timeEnd).length === 0) return false;
        }

        if (searchText) {
          if (searchText === '需報名') {
            if (ev.need_apply !== '需報名') return false;
          } else if (searchText === '不需報名' || searchText === '免報名') {
            if (ev.need_apply === '需報名') return false;
          } else {
            if (!buildSearchText(ev).includes(searchText)) return false;
          }
        }

        return true;
      });

      currentFilteredEvents = matchedEvents;

      const totalCountEl = document.getElementById('filterTotalCount');
      if (totalCountEl) totalCountEl.innerText = matchedEvents.length;

      // 計算符合條件之總場次數 (若有時段或名額篩選，只統計符合條件之場次)
      let totalSessions = 0;
      matchedEvents.forEach(ev => {
        if (isSessionFilterActive(timeStart, timeEnd)) {
          totalSessions += getVisibleSessions(ev, timeStart, timeEnd).length;
        } else {
          const sCount = (ev.sessions && ev.sessions.length > 0) ? ev.sessions.length : (ev.sessions_count || 1);
          totalSessions += sCount;
        }
      });

      const totalSessionsEl = document.getElementById('filterTotalSessions');
      if (totalSessionsEl) totalSessionsEl.innerText = totalSessions;

      const mobileCountEl = document.getElementById('mobileCountBadge');
      if (mobileCountEl) mobileCountEl.innerText = matchedEvents.length;

      if (activeLayers.has('events')) {
        if (layerGroupMap['events'] && !map.hasLayer(layerGroupMap['events'])) {
          layerGroupMap['events'].addTo(map);
        }

        const buildingMap = new Map();
        const buildingMarkersMap = new Map();
        matchedEvents.forEach(ev => {
          if (!ev.lat || !ev.lng) return;
          const lat = parseFloat(ev.lat);
          const lng = parseFloat(ev.lng);
          if (isNaN(lat) || isNaN(lng)) return;

          const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
          if (!buildingMap.has(key)) {
            buildingMap.set(key, {
              lat: lat,
              lng: lng,
              locationName: ev.location || '活動地點',
              events: []
            });
          }
          buildingMap.get(key).events.push(ev);
        });

        buildingMap.forEach((bData, key) => {
          const count = bData.events.length;
          const marker = L.marker([bData.lat, bData.lng], { icon: createBuildingPin(count) });
          buildingMarkersMap.set(key, marker);

          const eventItemsHtml = bData.events.map(e => {
            const regInfo = e.regInfo || { status: 'walk_in', hasStats: false };

            let applyTagHtml = '';
            if (e.need_apply === '需報名') {
              if (regInfo.hasStats && regInfo.totalLimit > 0) {
                const hasRemain = !!regInfo.hasAvailable;
                const statClass = hasRemain ? 'available' : 'overbooked';
                const statIcon = hasRemain ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-xmark"></i>';
                const statText = hasRemain
                  ? `尚有名額 (餘 ${regInfo.availableRemain} 席)`
                  : `已額滿 (${regInfo.totalRegistered}/${regInfo.totalLimit}人)`;
                const statTitle = hasRemain
                  ? `報名狀況：尚有名額！(全場累計已報名 ${regInfo.totalRegistered} 人 / 總限額 ${regInfo.totalLimit} 人)`
                  : `報名狀況：名額已滿 (全場累計已報名 ${regInfo.totalRegistered} 人 / 總限額 ${regInfo.totalLimit} 人)`;
                applyTagHtml = `<span class="meta-tag tag-reg-stat ${statClass}" title="${statTitle}">${statIcon} ${statText}</span>`;
              } else {
                applyTagHtml = `<span class="meta-tag tag-needapply"><i class="fa-solid fa-ticket"></i> 需報名</span>`;
              }
            } else {
              applyTagHtml = `<span class="meta-tag tag-walkin"><i class="fa-solid fa-door-open"></i> 不需報名</span>`;
            }

            const compactSessionsHtml = renderCompactSessionsHtml(e, true);

            const escapedTitle = (e.title || '').replace(/'/g, "\'");
            const regLinkHtml = (e.need_apply === '需報名') ? `
              <a href="../%E5%A0%B1%E5%90%8D%E5%88%86%E6%9E%90/index.html?search=${encodeURIComponent(e.title)}" target="_blank" onclick="trackEvent('click_reg_detail', { title: '${escapedTitle}' }); event.stopPropagation()" class="card-link-reg" title="查看「${e.title}」各場次錄取率分析">
                <i class="fa-solid fa-chart-column"></i> 報名詳情 <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9.5px;"></i>
              </a>
            ` : '';

            return `
              <div class="building-event-item" id="popup_event_${e.event_id}" onclick="focusEventCard('${e.event_id}')" style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); cursor: pointer; transition: all 0.2s ease;">
                <div class="building-event-item-title" style="font-size: 13.5px; font-weight: 800; color: #0f172a; line-height: 1.35;">${e.title}</div>
                <div class="building-event-item-meta" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 11px; margin: 4px 0 6px 0;">
                  <span style="color: #475569; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; line-height: 1.3;">
                    <i class="fa-solid fa-building-columns" style="color: #94a3b8; font-size: 10px;"></i> ${e.organizer || '中研院'}
                  </span>
                  <div style="margin-left: auto; display: flex; align-items: center;">
                    ${applyTagHtml}
                  </div>
                </div>
                ${compactSessionsHtml}
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 4px; border-top: 1px solid #f1f5f9;">
                  ${regLinkHtml}
                  <a href="${e.url}" target="_blank" onclick="trackEvent('click_official_link', { title: '${escapedTitle}' }); event.stopPropagation()" style="color: #2563eb; font-weight: 800; font-size: 11.5px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-left: auto;">
                    官方詳情 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  </a>
                </div>
              </div>
            `;
          }).join('');

          marker.on('click', () => {
            trackEvent('click_building_marker', { building: bData.locationName, count: count });
          });

          marker.bindPopup(`
            <div class="popup-box">
              <div class="popup-title">📍 ${bData.locationName}</div>
              <div class="popup-badge" style="background:#dbeafe; color:#1e40af;">共 ${count} 場開放日活動<button type="button" class="popup-copy-link" data-loc="${encodeURIComponent(bData.locationName)}" onclick="copyShareLink('loc', decodeURIComponent(this.dataset.loc), this)" title="複製這棟館舍的連結（可做成 QR Code 貼在門口）"><i class="fa-solid fa-link"></i> 複製此館連結</button>${bData.lat >= 24.0 && window.ROUTE_GRAPH ? `<button type="button" class="popup-route-btn" data-loc="${encodeURIComponent(bData.locationName)}" onclick="RouteNav.open(decodeURIComponent(this.dataset.loc))" title="規劃走到這棟館舍的步行路線"><i class="fa-solid fa-person-walking"></i> 帶我去</button>` : ''}</div>
              <div class="building-event-list">
                ${eventItemsHtml}
              </div>
            </div>
          `);

          marker.addTo(layerGroupMap['events']);
        });

        if (matchedEvents.length === 0) {
          cardsContainer.innerHTML = `
            <div style="text-align:center; padding: 40px 16px; color: #94a3b8;">
              <i class="fa-solid fa-calendar-xmark" style="font-size: 36px; margin-bottom: 10px; color: #cbd5e1;"></i>
              <div style="font-size: 14px; font-weight: 700; color: #475569;">無符合條件的活動</div>
              <div style="font-size: 12px; margin-top: 4px; color: #94a3b8;">請嘗試調整時間區間、關鍵字或篩選條件</div>
            </div>
          `;
        }

        matchedEvents.forEach(ev => {
          const card = document.createElement('div');
          card.className = 'event-card';
          card.id = `card_${ev.event_id}`;

          let themeClass = 'theme-kids';
          if ((ev.theme || '').includes('院區')) themeClass = 'theme-open';
          if ((ev.theme || '').includes('南')) themeClass = 'theme-south';

          const regInfo = ev.regInfo || { status: 'walk_in', hasStats: false };

          let applyTagHtml = '';
          if (ev.need_apply === '需報名') {
            if (regInfo.hasStats && regInfo.totalLimit > 0) {
              const hasRemain = !!regInfo.hasAvailable;
              const statClass = hasRemain ? 'available' : 'overbooked';
              const statIcon = hasRemain ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-xmark"></i>';
              const statText = hasRemain
                ? `尚有名額 (餘 ${regInfo.availableRemain} 席)`
                : `已額滿 (${regInfo.totalRegistered}/${regInfo.totalLimit}人)`;
              const statTitle = hasRemain
                ? `報名狀況：尚有名額！(全場累計已報名 ${regInfo.totalRegistered} 人 / 總限額 ${regInfo.totalLimit} 人)`
                : `報名狀況：名額已滿 (全場累計已報名 ${regInfo.totalRegistered} 人 / 總限額 ${regInfo.totalLimit} 人)`;
              applyTagHtml = `<span class="meta-tag tag-reg-stat ${statClass}" title="${statTitle}">${statIcon} ${statText}</span>`;
            } else {
              applyTagHtml = `<span class="meta-tag tag-needapply"><i class="fa-solid fa-ticket"></i> 需報名</span>`;
            }
          } else {
            applyTagHtml = `<span class="meta-tag tag-walkin"><i class="fa-solid fa-door-open"></i> 不需報名</span>`;
          }

          const compactSessionsHtml = renderCompactSessionsHtml(ev, false);
          const escapedEvTitle = (ev.title || '').replace(/'/g, "\'");

          const regLinkHtml = (ev.need_apply === '需報名') ? `
            <a href="../%E5%A0%B1%E5%90%8D%E5%88%86%E6%9E%90/index.html?search=${encodeURIComponent(ev.title)}" target="_blank" class="card-link-reg" onclick="trackEvent('click_reg_detail', { title: '${escapedEvTitle}' }); event.stopPropagation()" title="查看此活動各場次報名人數與錄取率">
              <i class="fa-solid fa-chart-column"></i> 報名詳情 <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9.5px;"></i>
            </a>
          ` : '';

          card.innerHTML = `
            <div class="card-top">
              <div class="card-title">${ev.title}</div>
              <div class="theme-pill ${themeClass}">${ev.theme || '一般活動'}</div>
            </div>
            <div class="card-organizer">
              <i class="fa-solid fa-building-columns"></i> ${ev.organizer}
            </div>
            <div class="card-meta-tags">
              <span class="meta-tag"><i class="fa-solid fa-tags"></i> ${ev.event_type || '活動'}</span>
              ${applyTagHtml}
              <span class="meta-tag"><i class="fa-solid fa-users"></i> ${ev.target || '全年齡'}</span>
            </div>
            <div class="card-location">
              <span><i class="fa-solid fa-location-dot" style="color:#dc2626;"></i> ${ev.location || '活動地點'}</span>
              <a href="https://maps.google.com?q=${ev.lat},${ev.lng}" target="_blank" onclick="trackEvent('click_navigation', { destination: '${(ev.location || '').replace(/'/g, "\'")}' }); event.stopPropagation()" style="color:#2563eb; font-size:11px; font-weight:800; text-decoration:none;">
                Google導航 <i class="fa-solid fa-diamond-turn-right"></i>
              </a>
              ${parseFloat(ev.lat) >= 24.0 && window.ROUTE_GRAPH ? `<button type="button" class="card-route-btn" data-loc="${encodeURIComponent(ev.location || '')}" onclick="event.stopPropagation(); RouteNav.open(decodeURIComponent(this.dataset.loc))" title="院區內步行路線"><i class="fa-solid fa-person-walking"></i> 步行路線</button>` : ''}
            </div>
            ${compactSessionsHtml}
            <div class="card-footer">
              <span style="font-size:11px; color:#64748b;">場次: ${ev.sessions ? ev.sessions.length : 1} 場</span>
              <div class="card-footer-actions">
                <button type="button" class="card-link-copy" onclick="event.stopPropagation(); copyShareLink('event', '${ev.event_id}', this)" title="複製這場活動的連結（可貼到 LINE 或做成 QR Code）"><i class="fa-solid fa-link"></i></button>
                ${regLinkHtml}
                <a href="${ev.url}" target="_blank" class="card-link" onclick="trackEvent('click_official_link', { title: '${escapedEvTitle}' }); event.stopPropagation()">
                  官方詳情 <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
              </div>
            </div>
          `;

          card.onclick = () => {
            trackEvent('select_event_card', { title: ev.title, organizer: ev.organizer, theme: ev.theme });
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            if (ev.lat && ev.lng) {
              const lat = parseFloat(ev.lat);
              const lng = parseFloat(ev.lng);
              const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
              const marker = buildingMarkersMap.get(key);

              map.flyTo([lat, lng], 18, { duration: 0.8 });

              if (marker) {
                setTimeout(() => {
                  marker.openPopup();
                  const popupItem = document.getElementById(`popup_event_${ev.event_id}`);
                  if (popupItem) {
                    document.querySelectorAll('.building-event-item').forEach(el => {
                      el.style.borderColor = '#e2e8f0';
                      el.style.background = '#ffffff';
                    });
                    popupItem.style.borderColor = '#2563eb';
                    popupItem.style.background = '#eff6ff';
                    popupItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                }, 250);
              }
              if (window.innerWidth <= 768) closeMobileDrawer();

          };

          cardsContainer.appendChild(card);
        });
      } else {
        if (layerGroupMap['events'] && map.hasLayer(layerGroupMap['events'])) {
          map.removeLayer(layerGroupMap['events']);
        }
      }

      allFacilitiesData.forEach(fac => {
        if (activeLayers.has(fac.category)) {
          // 依據選擇的日期主題 (兒童科普日 10/03, 院區開放日 10/17, 南部院區 11/14) 精確過濾設施點位
          if (currentThemeFilter === '南部院區開放日') {
            if (fac.lat >= 24.0) return;
            if (fac.applicable_themes && fac.applicable_themes.length > 0 && !fac.applicable_themes.includes('南部院區開放日')) return;
          } else if (currentThemeFilter === '兒童科普日') {
            if (fac.lat < 24.0) return;
            if (fac.applicable_themes && fac.applicable_themes.length > 0 && !fac.applicable_themes.includes('兒童科普日')) return;
          } else if (currentThemeFilter === '院區開放日') {
            if (fac.lat < 24.0) return;
            if (fac.applicable_themes && fac.applicable_themes.length > 0 && !fac.applicable_themes.includes('院區開放日')) return;
          } else {
            // ALL 模式下，依當前地圖中心/院區顯示設施
            const isSouthCampus = (map.getCenter().lat < 24.0);
            if (isSouthCampus && fac.lat >= 24.0) return;
            if (!isSouthCampus && fac.lat < 24.0) return;
          }

          if (layerGroupMap[fac.category] && !map.hasLayer(layerGroupMap[fac.category])) {
            layerGroupMap[fac.category].addTo(map);
          }
          const pin = createFacilityPin(fac.category);
          const fMarker = L.marker([fac.lat, fac.lng], { icon: pin });
          fMarker.on('click', () => {
            trackEvent('click_facility_marker', { facility: fac.name, category: fac.category });
          });
          
          const dayBadgeHtml = fac.applicable_days_display ? `<span class="popup-badge" style="background:#f1f5f9; color:#475569; font-size:10px; font-weight:700; border:1px solid #cbd5e1;"><i class="fa-regular fa-calendar" style="color:#2563eb;"></i> 開放日：${fac.applicable_days_display}</span>` : '';

          fMarker.bindPopup(`
            <div class="popup-box">
              <div class="popup-title">📍 ${fac.name}</div>
              <div style="display:flex; align-items:center; gap:5px; margin:4px 0 6px 0; flex-wrap:wrap;">
                <span class="popup-badge fac-${fac.category}" style="color:#ffffff; font-weight:800;">${fac.category}</span>
                ${dayBadgeHtml}
              </div>
              ${fac.description ? `<div class="popup-desc">${fac.description}</div>` : ''}
              <div style="margin-top:6px;">
                <a href="https://maps.google.com?q=${fac.lat},${fac.lng}" target="_blank" onclick="trackEvent('click_navigation', { destination: '${fac.name}' }); event.stopPropagation()" style="color:#2563eb; font-weight:800; font-size:11.5px; text-decoration:none;">

                <div style="font-weight:800; font-size:14px; color:#0f172a; line-height:1.35;">📍 ${fac.name}</div>
                <span class="popup-badge fac-${fac.category}" style="color:#ffffff; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px; flex-shrink:0;">${fac.category}</span>
              </div>
              ${fac.description ? `<div style="font-size:12px; color:#475569; line-height:1.5; white-space:pre-line; margin-top:2px;">${fac.description}</div>` : ''}
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding-top:6px; border-top:1px solid #f1f5f9; flex-wrap:wrap; gap:4px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-size:11px; color:#94a3b8;"><i class="fa-solid fa-map-pin"></i> ${fac.folder_name || '週邊設施'}</span>
                  ${dayBadgeHtml}
                </div>
                <a href="https://maps.google.com?q=${fac.lat},${fac.lng}" target="_blank" onclick="trackEvent('click_navigation', { destination: '${fac.name}' }); event.stopPropagation()" style="color:#2563eb; font-size:11.5px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">
                  Google 導航 <i class="fa-solid fa-diamond-turn-right"></i>
                </a>
              </div>
            `;
            fCard.onclick = () => {
              trackEvent('select_facility_card', { facility: fac.name, category: fac.category });
              map.flyTo([fac.lat, fac.lng], 18, { duration: 0.8 });
              fMarker.openPopup();
              if (window.innerWidth <= 768) closeMobileDrawer();
            };
            cardsContainer.appendChild(fCard);
          }
        } else {
          if (layerGroupMap[fac.category] && map.hasLayer(layerGroupMap[fac.category])) {
            map.removeLayer(layerGroupMap[fac.category]);
          }
        }
      });

      // 動態更新報名方式與名額狀態徽章統計
      updateFilterBadges();
      updateResetButton();
    }

    // 動態計算並更新各篩選條件之活動場次統計徽章
    function updateFilterBadges() {
      const timeStart = document.getElementById('timeStartSelect')?.value || 'ALL';
      const timeEnd = document.getElementById('timeEndSelect')?.value || 'ALL';
      const groupFilter = document.getElementById('groupSelect')?.value || 'ALL';
      const typeFilter = document.getElementById('typeSelect')?.value || 'ALL';
      const searchText = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

      let countNeedApply = 0;
      let countWalkIn = 0;
      // 名額狀態子篩選以「場次」計數，與報名分析頁的場次數一致
      let countNeedSessions = 0;
      let countAvail = 0;
      let countFull = 0;

      allEventsData.forEach(ev => {
        if (currentThemeFilter !== 'ALL') {
          if (currentThemeFilter === '兒童科普日') {
            const is1003 = (ev.days_held && ev.days_held.includes('10/03')) || (ev.days_held_display || '').includes('10/03');
            if (ev.theme !== '兒童科普日' && !is1003) return;
          } else if (currentThemeFilter === '院區開放日') {
            const is1017 = (ev.days_held && ev.days_held.includes('10/17')) || (ev.days_held_display || '').includes('10/17');
            if (ev.theme !== '院區開放日' && !is1017) return;
          } else if (currentThemeFilter === '南部院區開放日') {
            const is1114 = (ev.days_held && ev.days_held.includes('11/14')) || (ev.days_held_display || '').includes('11/14');
            if (!(ev.theme || '').startsWith('南') && !is1114) return;
          } else {
            if (ev.theme !== currentThemeFilter) return;
          }
        }

        if (groupFilter !== 'ALL' && (ev.group_name || '') !== groupFilter) return;
        if (typeFilter !== 'ALL' && (ev.event_type || '') !== typeFilter) return;

        if (timeStart !== 'ALL' || timeEnd !== 'ALL') {
          const sessions = ev.sessions || [];
          if (sessions.length === 0 || !sessions.some(s => isSessionInTimeRange(s, timeStart, timeEnd))) return;
        }

        if (searchText && searchText !== '需報名' && searchText !== '不需報名' && searchText !== '免報名') {
          if (!buildSearchText(ev).includes(searchText)) return;
        }

        if (ev.need_apply === '需報名') {
          countNeedApply++;
          (ev.sessions || []).forEach(s => {
            if (!isSessionInTimeRange(s, timeStart, timeEnd)) return;
            countNeedSessions++;
            const stat = getSessionRegistrationStat(ev, s);
            if (!stat) return;
            if (isStatAvailable(stat)) countAvail++;
            else countFull++;
          });
        } else {
          countWalkIn++;
        }
      });

      const bNeed = document.getElementById('badgeNeedApply');
      if (bNeed) bNeed.innerText = countNeedApply;
      const bWalk = document.getElementById('badgeWalkIn');
      if (bWalk) bWalk.innerText = countWalkIn;
      const cAll = document.getElementById('countNeedApplyAll');
      if (cAll) cAll.innerText = countNeedSessions;
      const cAvail = document.getElementById('countNeedApplyAvail');
      if (cAvail) cAvail.innerText = countAvail;
      const cFull = document.getElementById('countNeedApplyFull');
      if (cFull) cFull.innerText = countFull;
    }

    function toggleLayer(layerName, el) {
      trackEvent('toggle_facility_layer', { facility: layerName });
      if (layerName === 'events') {
        if (activeLayers.has('events')) {
          activeLayers.delete('events');
          el.classList.remove('active');
        } else {
          activeLayers.add('events');
          el.classList.add('active');
        }
      } else {
        if (activeLayers.has(layerName)) {
          activeLayers.delete(layerName);
          el.classList.remove('active');
          if (layerGroupMap[layerName] && map.hasLayer(layerGroupMap[layerName])) {
            map.removeLayer(layerGroupMap[layerName]);
          }
        } else {
          activeLayers.add(layerName);
          el.classList.add('active');
          if (layerGroupMap[layerName] && !map.hasLayer(layerGroupMap[layerName])) {
            layerGroupMap[layerName].addTo(map);
          }

          const facs = allFacilitiesData.filter(f => {
            if (f.category !== layerName) return false;
            if (currentThemeFilter === '南部院區開放日') return (f.lat < 24.0 && (!f.applicable_themes || f.applicable_themes.includes('南部院區開放日')));
            if (currentThemeFilter === '兒童科普日') return (f.lat >= 24.0 && (!f.applicable_themes || f.applicable_themes.includes('兒童科普日')));
            if (currentThemeFilter === '院區開放日') return (f.lat >= 24.0 && (!f.applicable_themes || f.applicable_themes.includes('院區開放日')));
            return (map.getCenter().lat < 24.0 ? f.lat < 24.0 : f.lat >= 24.0);
          });
          if (facs.length > 0) {
            const first = facs[0];
            map.flyTo([first.lat, first.lng], 17, { duration: 0.8 });
          }
        }
      }
      applyFilters();
    }

    // 目前套用中的篩選條件數（顯示在「清除所有篩選條件」按鈕上）
    function countActiveFilters() {
      const val = id => document.getElementById(id)?.value || 'ALL';
      let n = 0;
      if ((document.getElementById('searchInput')?.value || '').trim()) n++;
      if (currentThemeFilter !== 'ALL') n++;
      if (currentApplyFilter !== 'ALL') n++;
      if (currentApplyFilter === '需報名' && currentQuotaFilter !== 'ALL') n++;
      ['groupSelect', 'typeSelect', 'timeStartSelect', 'timeEndSelect'].forEach(id => { if (val(id) !== 'ALL') n++; });
      return n;
    }

    function updateResetButton() {
      const btn = document.getElementById('btnResetFilters');
      if (!btn) return;
      const n = countActiveFilters();
      btn.classList.toggle('has-filters', n > 0);
      const c = document.getElementById('resetFilterCount');
      if (c) c.innerText = n > 0 ? `${n} 項條件` : '';
    }

    // 清除所有篩選條件：關鍵字、活動日、報名方式與名額狀態、學術組別、活動類型、時段
    function resetMapFilters() {
      trackEvent('reset_all_map_filters');
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';

      currentThemeFilter = 'ALL';
      updateThemeChipActive('ALL');

      currentApplyFilter = 'ALL';
      currentQuotaFilter = 'ALL';
      document.querySelectorAll('.apply-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-apply') === 'ALL'));
      document.querySelectorAll('.apply-sub-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-quota') === 'ALL'));
      const subRow = document.getElementById('applySubRow');
      if (subRow) subRow.style.display = 'none';

      ['groupSelect', 'typeSelect', 'timeStartSelect', 'timeEndSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = 'ALL';
      });

      flyToCampus('nankang', false);
      applyFilters();
    }

    function updateThemeChipActive(theme) {
      document.querySelectorAll('.theme-card-chip').forEach(c => {
        if (c.getAttribute('data-theme') === theme) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });
    }

    function setThemeFilter(theme, el) {
      trackEvent('filter_theme', { theme: theme });
      currentThemeFilter = theme;
      if (theme !== '南部院區開放日') {
        lastNankangTheme = theme;
      }
      if (el) {
        document.querySelectorAll('.theme-card-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
      } else {
        updateThemeChipActive(theme);
      }

      if (theme === '南部院區開放日') {
        flyToCampus('south', false);
      } else if (theme === '兒童科普日' || theme === '院區開放日') {
        flyToCampus('nankang', false);
      }

      applyFilters();
    }

    // 地圖容器尚未有尺寸時（頁面剛載入、分頁在背景）flyTo 會丟錯並中斷後續篩選，改用 setView
    function safeFlyTo(latlng, zoom) {
      const size = map.getSize();
      if (!size.x || !size.y) { map.setView(latlng, zoom, { animate: false }); return; }
      try { map.flyTo(latlng, zoom, { duration: 0.8 }); } catch (e) { map.setView(latlng, zoom, { animate: false }); }
    }

    function flyToCampus(campus, syncTheme = true) {
      trackEvent('switch_campus', { campus: campus });
      document.querySelectorAll('.campus-btn').forEach(b => b.classList.remove('active'));
      if (campus === 'nankang') {
        const btn = document.getElementById('btnCampusNankang');
        if (btn) btn.classList.add('active');
        safeFlyTo([25.0418, 121.6145], 16);

        if (syncTheme) {
          if (currentThemeFilter === '南部院區開放日') {
            currentThemeFilter = lastNankangTheme || 'ALL';
            updateThemeChipActive(currentThemeFilter);
            applyFilters();
          }
        }
      } else if (campus === 'south') {
        const btn = document.getElementById('btnCampusSouth');
        if (btn) btn.classList.add('active');
        safeFlyTo([22.9245, 120.2919], 16);

        if (syncTheme) {
          if (currentThemeFilter !== '南部院區開放日') {
            currentThemeFilter = '南部院區開放日';
            updateThemeChipActive('南部院區開放日');
            applyFilters();
          }
        }
      }
    }

    // 複製分享連結：?event=活動編號 或 ?loc=館舍名稱（打開後直接定位，也可做成 QR Code）
    function copyShareLink(type, value, el) {
      const url = `${location.origin}${location.pathname}?${type}=${encodeURIComponent(value)}`;
      trackEvent('copy_share_link', { type: type, value: String(value) });
      const done = () => {
        if (!el) return;
        const old = el.innerHTML;
        el.classList.add('copied');
        el.innerHTML = el.classList.contains('popup-copy-link') ? '<i class="fa-solid fa-check"></i> 已複製' : '<i class="fa-solid fa-check"></i>';
        setTimeout(() => { el.classList.remove('copied'); el.innerHTML = old; }, 1600);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(done, () => window.prompt('請複製這個連結：', url));
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { window.prompt('請複製這個連結：', url); }
        document.body.removeChild(ta);
      }
    }

    function focusEventCard(eventId) {
      const card = document.getElementById(`card_${eventId}`);
      if (card) {
        document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function openMobileDrawer() {
      const panel = document.getElementById('sidebarPanel');
      const backdrop = document.getElementById('mobileBackdrop');
      if (panel) panel.classList.add('open');
      if (backdrop) backdrop.classList.add('active');
    }

    function closeMobileDrawer() {
      const panel = document.getElementById('sidebarPanel');
      const backdrop = document.getElementById('mobileBackdrop');
      if (panel) panel.classList.remove('open');
      if (backdrop) backdrop.classList.remove('active');
    }

    // 匯出目前篩選活動與場次之 EXCEL 清單 (CSV with UTF-8 BOM，相容微軟 Excel 與 Google 試算表)
    function exportFilteredEventsExcel() {
      if (!currentFilteredEvents || currentFilteredEvents.length === 0) {
        alert('目前篩選條件下沒有符合的活動可供匯出！');
        return;
      }

      trackEvent('click_export_excel', { count: currentFilteredEvents.length });

      function cleanCsvField(val) {
        if (val === null || val === undefined) return '""';
        let str = String(val).trim();
        str = str.replace(/"/g, '""');
        str = str.split(String.fromCharCode(13)).join('').split(String.fromCharCode(10)).join(' ');
        return `"${str}"`;
      }

      const key = [...seen.keys()].find(k => sameName(k, name));
      if (key) { const o = seen.get(key); if (dAt < o.d) Object.assign(o, { d: dAt, s: sAt, side }); if (isPlace) { o.place = true; if (key !== name) { seen.delete(key); seen.set(name, Object.assign(o, { name })); } } return; }   // 以活動網站的館舍名稱為準
      seen.set(name, { name, d: dAt, s: sAt, side, place: isPlace });
    };
    LANDMARKS.forEach(lm => {
      let bd = Infinity, bs = 0, bi = 0;
      for (let i = 1; i < P.length - 1; i++) { const d = distToLandmark(P[i].x, P[i].z, lm); if (d < bd) { bd = d; bs = P[i].s; bi = i; } }
      if (bd < NEAR_PATH) consider(lm.name, bd, bs, sideOf(P[Math.max(0, bi - 1)].x, P[Math.max(0, bi - 1)].z, P[bi + 1].x, P[bi + 1].z, lm.cx, lm.cz), false);
    });
    PLACES.forEach(pl => {
      const [px, pz] = toXZ(pl.lat, pl.lng);
      let bd = Infinity, bs = 0, bi = 1;
      for (let i = 1; i < P.length; i++) { const d = segDist(px, pz, P[i - 1].x, P[i - 1].z, P[i].x, P[i].z); if (d < bd) { bd = d; bs = P[i].s; bi = i; } }
      if (bd < NEAR_PATH + 20) consider(pl.name, bd, bs, sideOf(P[bi - 1].x, P[bi - 1].z, P[bi].x, P[bi].z, px, pz), true);
    });

    // 逐步指示
    const nearMark = s => { let best = null; marks.forEach(m => { const dd = Math.abs(m.s - s); if (dd < 35 && m.d < 40 && (!best || dd + m.d < Math.abs(best.s - s) + best.d)) best = m; }); return best; };
    const stops = [0].concat(turns.map(t => t.s)).concat([total]);
    const turnMarks = turns.map(t => nearMark(t.s));
    const steps = [];
    for (let k = 0; k < stops.length - 1; k++) {
      const a = stops[k], b = stops[k + 1];
      const atTurn = [turnMarks[k - 1], turnMarks[k]].filter(Boolean);   // 已拿來當轉彎地標的，不再列入「會經過」
      let passing = marks.filter(m => m.s > a + 5 && m.s <= b + 5 && (k === stops.length - 2 || m.s < b - 8) && !atTurn.includes(m));
      const more = passing.length > 3;
      if (more) {                                                      // 太多時分成前、中、後三段，各挑最靠近路邊的一棟
        const len = (b - a) / 3;
        passing = [0, 1, 2].map(i => passing.filter(m => m.s >= a + i * len - 5 && m.s < a + (i + 1) * len + 5).sort((x, y) => x.d - y.d)[0])
          .filter((m, i, arr) => m && arr.indexOf(m) === i);
      }
      const passTxt = passing.map(m => disp(m.name) + (m.side ? `（${m.side}）` : '')).join('、') + (more ? ' 等' : '');
      let head;
      if (k === 0) head = `從 <b>${disp(from.name)}</b> 出發`;
      else { const t = turns[k - 1], m = turnMarks[k - 1]; head = `${m ? `在 <b>${disp(m.name)}</b> 附近` : '在路口'}<b class="rn-turn">${t.word}</b>`; }
      steps.push({ s: a, icon: k === 0 ? 'fa-person-walking' : Math.abs(turns[k - 1].deg) > 150 ? 'fa-rotate-left' : turns[k - 1].deg > 0 ? 'fa-arrow-left' : 'fa-arrow-right', html: `${head}，直走約 ${fmtM(b - a)}` + (passing.length ? `<small>會經過 ${passTxt}</small>` : '') });
    }
    const L = P.length, endSide = sideOf(P[L - 3] ? P[L - 3].x : P[0].x, P[L - 3] ? P[L - 3].z : P[0].z, P[L - 2].x, P[L - 2].z, tx, tz);
    steps.push({ s: total, icon: 'fa-flag-checkered', html: `抵達 <b>${disp(to.name)}</b>${Math.hypot(P[L - 2].x - tx, P[L - 2].z - tz) > 8 ? `（在${endSide}手邊）` : ''}` });

    const minutes = Math.max(1, Math.ceil((total + climb * CLIMB_FACTOR) / WALK_M_PER_MIN));
    return { P, total, climb, minutes, steps, marks, turns };
  }

  function suggestions(text, isFrom) {
